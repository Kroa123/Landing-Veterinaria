[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Archivos de /assets/ que no existen (chunk de una versión anterior) responden 404 y no
# index.html: así el import dinámico falla limpio y la app ofrece recargar (RouteError).
# Va antes del catch-all; los archivos que sí existen se sirven primero (sin force).
# /404.html (public/404.html) es una página mínima sin estilos inline (CSP).
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

# SPA: toda ruta sin archivo (/tienda, /nosotros...) sirve index.html con estado 200.
# Netlify sirve primero los archivos que existen (assets, favicon), así que no los pisa.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
